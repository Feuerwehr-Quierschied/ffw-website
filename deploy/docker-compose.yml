services:
  web:
    image: ghcr.io/feuerwehr-quierschied/ffw-website:dev
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_URL: https://dev.feuerwehr-quierschied.org
      LOG_CHANNEL: stderr
      # Noch keine Datenbank: Sessions im Cookie, Cache im Container, Jobs sofort.
      SESSION_DRIVER: cookie
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    # Nur auf der internen Adresse lauschen, damit die Seite ausschließlich
    # über Traefik erreichbar ist. WEB_BIND steht in der .env.
    ports:
      - "${WEB_BIND:?WEB_BIND in .env setzen}:8080:8080"
